name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-mira-ble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ha-mira-ble
      # Until mira-ble is on PyPI the tests use a path dependency on ../mira-ble.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 83noit/mira-ble
          persist-credentials: false
          path: mira-ble
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No caching on tag pushes, to rule out cache poisoning.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          working-directory: ha-mira-ble
      - run: uv sync --locked --python 3.14
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term
